name: 更新股價資料並發佈網站

on:
  schedule:
    # 台灣時間週一到週五 18:00（GitHub 用 UTC，台灣 = UTC+8）
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "template.html"
      - "build_site.py"
      - ".github/workflows/update.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: pip install yfinance pandas
      - name: 抓資料、產生網站
        env:
          TZ: Asia/Taipei
        run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 公開儲存庫 60 天沒有修改，GitHub 會自動停用排程；這裡讓它保持啟用
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: 超過 30 天沒有修改就更新 last_update.txt
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 30 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > last_update.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_update.txt
            git commit -m "保持排程啟用"
            git push
          else
            echo "最近 30 天內有修改，不需要處理"
          fi
      - name: 重新確認排程為啟用狀態
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
