name: 更新股價資料並發佈網站

on:
  schedule:
    # 台灣時間週一到週五 18:00（GitHub 用 UTC，台灣 = UTC+8）
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "template.html"
      - "build_site.py"
      - ".github/workflows/update.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: pip install yfinance pandas
      - name: 抓資料、產生網站
        env:
          TZ: Asia/Taipei
        run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
